[package]
name = "leopardwm-platform-win32"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Windows platform integration for LeopardWM (HWND manipulation, DWM cloaking)"

[dependencies]
leopardwm-core-layout = { path = "../core_layout" }
# UI_Notifications + Data_Xml_Dom power the WinRT toasts in toast.rs (shared by
# the daemon and watchdog). Additive over the workspace's Win32_* features.
windows = { workspace = true, features = ["UI_Notifications", "Data_Xml_Dom", "Win32_UI_Input", "Win32_Devices_HumanInterfaceDevice"] }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
winreg = "0.56"
# Used only by the explicit, offline native-desktop importer. Pin the private
# shell interface binding; normal tiling uses the documented read-only API.
winvd = "=0.0.49"
windows_058 = { package = "windows", version = "0.58", features = ["Win32_Foundation"] }

[dev-dependencies]
# Only the developer diagnostic needs the pointer injection bindings.
windows = { workspace = true, features = ["Win32_UI_Input_Pointer"] }

[[example]]
name = "touchpad_diagnostic"
path = "examples/touchpad_diagnostic.rs"
test = true

[lints]
workspace = true
